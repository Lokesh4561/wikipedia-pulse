name: Ingest pageviews

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour: GitHub often delays or skips scheduled runs
  workflow_dispatch:
    inputs:
      hours:
        description: "How many recent hours to check; files already landed are skipped"
        default: "48"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Land hourly files in the Databricks volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m ingest.fetch_pageviews --hours ${{ github.event.inputs.hours || '48' }}
