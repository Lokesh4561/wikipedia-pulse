name: Ingest pageviews

on:
  schedule:
    - cron: "37 * * * *"   # every hour at :37 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "How many recent hours to check (use 24+ for a backfill)"
        default: "6"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Land hourly files in the Databricks volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m ingest.fetch_pageviews --hours ${{ github.event.inputs.hours || '6' }}
